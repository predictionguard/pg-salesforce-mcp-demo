[project]
name = "salesforce-mcp-server"
version = "0.1.0"
description = "FastMCP server for Salesforce with JWT auth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.4",
    "simple-salesforce>=1.12.9",
    "pandas>=2.3.0",
    "python-dotenv>=1.2.0",
    "pyjwt>=2.8.0",
    "loguru>=0.7.2",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
